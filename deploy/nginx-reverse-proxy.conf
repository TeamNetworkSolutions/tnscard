# Nginx reverse proxy for TNS Card.
# Put this on the Nginx server that holds your HTTPS certificate.
# Replace 192.168.1.50 with the IP of the LXC/VM where you ran install.sh,
# and the certificate paths with yours.

server {
    listen 80;
    server_name tnscard.com www.tnscard.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tnscard.com www.tnscard.com;

    ssl_certificate     /etc/ssl/tnscard/fullchain.pem;
    ssl_certificate_key /etc/ssl/tnscard/privkey.pem;

    client_max_body_size 64m;   # photo and theme uploads

    location / {
        proxy_pass http://192.168.1.50:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
        proxy_read_timeout 120s;
    }
}

# Nginx Proxy Manager instead? Add a Proxy Host:
#   Domain: tnscard.com, www.tnscard.com
#   Scheme http, Forward IP 192.168.1.50, Port 80
#   SSL tab: your certificate, Force SSL on
#   Advanced: client_max_body_size 64m;
